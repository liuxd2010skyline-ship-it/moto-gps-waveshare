name: Build iPhone app (unsigned IPA)

on:
  push:
    paths:
      - .github/workflows/ios-ipa.yml
      - platforms/ios/**
      - shared/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: read

jobs:
  build-iphone-app:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Block changes to iPhone source until reviewed
        shell: bash
        run: |
          set -euo pipefail
          # These are the reviewed Git tree IDs of the iOS and shared sources.
          expected_ios=14fa44decbda23e3487771897d635555e898de10
          expected_shared=59cdca66795f6844e73daf0f3d8e18db20292ba2
          actual_ios="$(git rev-parse HEAD:platforms/ios)"
          actual_shared="$(git rev-parse HEAD:shared)"
          printf 'Source commit: %s\niOS tree: %s\nShared tree: %s\n' \
            "$GITHUB_SHA" "$actual_ios" "$actual_shared"
          if [[ "$actual_ios" != "$expected_ios" || "$actual_shared" != "$expected_shared" ]]; then
            echo 'iPhone source changed. Review the diff before updating the expected tree IDs.' >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain -- platforms/ios shared)" ]]; then
            echo 'The checked-out iPhone source is not clean.' >&2
            exit 1
          fi

      - name: Reject external Swift package dependencies
        shell: bash
        run: |
          if grep -Eq '\.package[[:space:]]*\([[:space:]]*url:' platforms/ios/Package.swift; then
            echo 'An external Swift package was added. Review it before building.' >&2
            exit 1
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install verified XcodeGen 2.46.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/xcodegen.zip" \
            'https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip'
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Generate Xcode project
        working-directory: platforms/ios
        run: xcodegen generate

      - name: Install pinned Baidu iOS SDK
        working-directory: platforms/ios
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --version 1.16.2 --no-document
          fi
          pod install --repo-update
          # Check the SDK binaries against the reviewed Baidu 7.2.0 archive.
          # CodeQL checks source code; it cannot analyze proprietary SDK binaries.
          for entry in \
            'BaiduMapAPI_Base 72d40fc7f8d8c53cc68b16a4d0939a2cf29380e82775f3b903486bcd3dc88d11' \
            'BaiduMapAPI_Map 18d272934367ca6d5426d443d11cce778fcfb8a35a9847076f7e9ca271ae8c57' \
            'BaiduMapAPI_Search be571dfa571bfd2637199e3d5078975d52c89ecc11382b56069b4e65ade8b416' \
            'BaiduMapAPI_Utils 46e91618627e193484f37cd3b1100d155437a189683bcd3a471a6a4d69845bb0'; do
            read -r name digest <<< "$entry"
            binary="$(find Pods/BaiduMapKit -type f -name "$name" -print -quit)"
            test -n "$binary"
            echo "$digest  $binary" | shasum -a 256 -c -
          done

      - name: Initialize CodeQL for Swift and C++
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift, c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build for iPhone without signing
        run: |
          xcodebuild \
            -workspace platforms/ios/MotoGPS.xcworkspace \
            -scheme MotoGPS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Scan compiled Swift and C++ code
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: never
          upload-database: false

      - name: Stop packaging if CodeQL reports a finding
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path

          files = sorted((Path(os.environ['RUNNER_TEMP']) / 'codeql-results').rglob('*.sarif'))
          if not files:
              raise SystemExit('CodeQL produced no SARIF report; refusing to package.')
          findings = []
          reviewed = []
          # CodeQL treats sqlite3_bind_int in a SELECT statement as a database
          # write. This index opens the bundled public OSM database READONLY;
          # these six calls only bind viewport coordinates to a lookup query.
          # The iOS tree lock above pins these exact source lines. All other
          # findings, including any in this file, still block packaging.
          readonly_query_lines = {
              217: 'minimumLatitudeE6',
              218: 'maximumLatitudeE6',
              219: 'minimumLongitudeE6',
              220: 'maximumLongitudeE6',
              221: 'latitudeE6',
              222: 'longitudeE6',
          }
          readonly_index = 'platforms/ios/App/Adapters/OfflineMap/SQLiteOfflineMapSceneIndex.swift'
          for file in files:
              report = json.loads(file.read_text(encoding='utf-8'))
              for run in report.get('runs', []):
                  for result in run.get('results', []):
                      rule = result.get('ruleId', 'unknown')
                      message = result.get('message', {}).get('text', '')
                      location = (result.get('locations') or [{}])[0].get('physicalLocation', {})
                      uri = location.get('artifactLocation', {}).get('uri', '').replace('\\', '/')
                      line = location.get('region', {}).get('startLine')
                      field = readonly_query_lines.get(line)
                      if (rule == 'swift/cleartext-storage-database'
                              and uri.endswith(readonly_index)
                              and field is not None
                              and f"'.{field}'" in message):
                          reviewed.append(line)
                      else:
                          findings.append((rule, uri, line, message))
          if reviewed and Counter(reviewed) != Counter(readonly_query_lines.keys()):
              raise SystemExit(f'Unexpected read-only query findings: {reviewed}')
          print(f'CodeQL reports: {len(files)}; reviewed read-only query findings: '
                f'{len(reviewed)}; blocking findings: {len(findings)}')
          for rule, uri, line, message in findings[:20]:
              print(f'{rule} at {uri}:{line}: {message[:300]}')
          if findings:
              raise SystemExit('Review and resolve CodeQL findings before packaging.')
          PY

      - name: Package IPA and record its SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/MOTO GPS.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/MOTO GPS.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/MotoGPS-unsigned.ipa"
          unzip -tq "$GITHUB_WORKSPACE/MotoGPS-unsigned.ipa"
          shasum -a 256 MotoGPS-unsigned.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checked IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MotoGPS-checked-unsigned-IPA
          path: |
            MotoGPS-unsigned.ipa
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
